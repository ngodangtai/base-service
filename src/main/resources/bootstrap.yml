info:
  app:
    description: API for Service Base system
    id: 299
    name: service-base
    version: 1.0.1
logback-kafka-appender:
  config: classpath:logback-spring.xml
logging:
  config: classpath:logback-spring.xml
  kafka:
    enabled: true
  level:
    com:
      company: DEBUG
      company.module.trading.logging.AutoLoggingServiceImpl: TRACE
    org:
      springframework:
        web: INFO
        web.reactive.function.client: DEBUG
management:
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
    shutdown:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*'
  health:
    configserver:
      enabled: true
    db:
      enabled: true
    diskspace:
      enabled: true
      path: .
      threshold: 10485760
    rabbit:
      enabled: true
    redis:
      enabled: true
    status:
      order: DOWN, OUT_OF_SERVICE, UNKNOWN, UP
  metrics:
    enable:
      all: true
  prometheus:
    metrics:
      export:
        enabled: true
  server:
    port: 18896
rabbitmq:
  exchange:
    name: vn.company.exchange
  queue:
    test-event:
      key: teams.service-base.test.key
      name: teams.service-base.test
security:
  private-key: /opt/company/service-base/cert/private_key.der
  public-key: /opt/company/service-base/cert/public_key.der
server:
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/json;charset=UTF-8
    min-response-size: 1024
  http2:
    enabled: true
    max-concurrent-stream-execution: 500
    max-concurrent-streams: 1000
  port: 8896
  servlet:
    context-path: /service-base
  ssl:
    key-store: /opt/company/service-base/cert/company.keystore
    key-store-password: company@123
    key-store-type: PKCS12
service:
  profile:
    url: https://apipub.company.com.vn/profile/v1
spring:
  aop:
    auto: 'true '
    proxy-target-class: 'true '
  application:
    name: service-base
  cache:
    cache-names: EhcacheBase
    jcache:
      config: classpath:ehcache.xml
  data:
    redis:
      default-topic: defaultTopic
      host: redis-sit-standalone.company.com.vn
      port: 6379
      database: 3
      password: Q95UGr7ZJG
      jedis:
        pool:
          max-idle: 30
          min-idle: 5
      connect-timeout: 30000
      timeout: 30000
      ttl: 60
      wait-time: 3000
      lease-time: 10000
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      connectionTimeout: 5000
      idleTimeout: 300000
      leakDetectionThreshold: 300000
      maxLifetime: 900000
      maximumPoolSize: 100
      minimumIdle: 50
    password: 2QVw4KnhepXYHkC3
    url: jdbc:oracle:thin:@10.82.71.188:1521/companysit
    username: CASDBSIT
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
    serialization:
      write_dates_as_timestamps: false
    time-zone: GMT+7
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
  kafka:
    bootstrap-servers: ${ENV_KAFKA_SERVERS:10.82.69.129:9092,10.82.69.237:9092,10.82.69.166:9092}
    consumer:
      auto-commit-interval: 10
      auto-offset-reset: latest
      enable-auto-commit: true
      group-id: company_profile.group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max:
          poll:
            interval:
              ms: 1200000
            records: 30
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringDeserializer
      value-serializer: org.apache.kafka.common.serialization.StringDeserializer
    properties:
      sasl:
        jaas:
          config: org.apache.kafka.common.security.plain.PlainLoginModule required username=${ENV_KAFKA_USERNAME:company_profile} password=${ENV_KAFKA_PASSWORD:vfx2n0CYH1dqIymp};
        mechanism: PLAIN
      security:
        protocol: SASL_PLAINTEXT
    template:
      audit-topic: ${ENV_AUDIT_KAFKA_TOPIC:logs.audit}
      crit-topic: ${ENV_FATAL_KAFKA_TOPIC:logs.error}
      default-topic: ${ENV_DEFAULT_KAFKA_TOPIC:logs.app}
      error-topic: ${ENV_ERROR_KAFKA_TOPIC:logs.error}
    topic:
      test-event: teams.service-base.test
  main:
    allow-bean-definition-overriding: true
  rabbitmq:
    host: sit-rabbitmq-amqp.company.com.vn
    listener:
      simple:
        acknowledge-mode: auto
        maxConcurrency: 5
    password: flex
    port: 5672
    template:
      retry:
        enabled: false
        max-attempts: 10
    username: flex
    virtual-host: casflex
  task:
    scheduling:
      pool:
        size: 3
  web:
    resources:
      cache:
        cachecontrol:
          cache-private: true
          cache-public: true
          max-age: 120
          must-revalidate: true
thread-pool:
  core-pool-size: 300
  executor:
    async-task:
      core-pool-size: 1
      max-pool-size: 5
      queue-capacity: 1000000
      thread-name-prefix: asyncTPool-
  max-pool-size: 300
  queue-capacity: 1000000
  thread-name-prefix: threadPool-